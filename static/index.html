<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rebalancer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = { darkMode:'class', theme:{ extend:{ colors:{ surface:{50:'#f8fafc',100:'#f1f5f9',700:'#1e293b',800:'#0f172a',900:'#020617'} } } } }
  </script>
  <style>
    [x-cloak]{display:none!important}
    @keyframes fade-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}.animate-fade-in{animation:fade-in .2s ease-out}
    @keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.4}}.pulse-dot{animation:pulse-dot 1.5s ease-in-out infinite}
  </style>
</head>
<body class="h-full bg-surface-900 text-slate-100 antialiased" x-data="app()" x-init="init()">

<div x-cloak x-show="toast.show" x-transition.opacity.duration.300ms
     class="fixed top-5 right-5 z-50 max-w-sm rounded-lg px-4 py-3 text-sm font-medium shadow-lg animate-fade-in"
     :class="toast.type==='error'?'bg-red-600/90 text-white':'bg-emerald-600/90 text-white'">
  <span x-text="toast.message"></span>
</div>

<div class="flex h-full">
  <nav class="flex w-56 flex-col border-r border-slate-700/50 bg-surface-800 px-3 py-6">
    <div class="mb-8 px-3">
      <h1 class="text-lg font-bold tracking-tight text-white">Rebalancer</h1>
      <p class="mt-0.5 text-xs text-slate-400">Crypto strategies</p>
    </div>
    <ul class="space-y-1 text-sm">
      <template x-for="nav in [{id:'strategies',label:'Strategies',icon:'M13 10V3L4 14h7v7l9-11h-7z'},{id:'account',label:'Account',icon:'M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z'},{id:'jobs',label:'Jobs',icon:'M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15'}]">
        <li><button @click="page=nav.id" class="flex w-full items-center gap-2.5 rounded-lg px-3 py-2 transition"
                    :class="page===nav.id?'bg-slate-700/60 text-white':'text-slate-400 hover:bg-slate-700/30 hover:text-slate-200'">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" :d="nav.icon"/></svg>
          <span x-text="nav.label"></span>
        </button></li>
      </template>
    </ul>
    <div class="mt-auto px-3">
      <div class="flex items-center gap-2 text-xs">
        <span class="h-2 w-2 rounded-full" :class="health==='ok'?'bg-emerald-400 pulse-dot':health==='loading'?'bg-yellow-400 pulse-dot':'bg-red-400'"></span>
        <span class="text-slate-400" x-text="health==='ok'?'Workers online':health==='loading'?'Checking...':'Workers offline'"></span>
      </div>
    </div>
  </nav>

  <main class="flex-1 overflow-y-auto">
    <div class="mx-auto max-w-5xl px-8 py-8">

      <!-- ==================== STRATEGIES ==================== -->
      <template x-if="page==='strategies'">
        <div class="animate-fade-in">
          <div class="flex items-center justify-between">
            <div><h2 class="text-2xl font-bold text-white">Strategies</h2><p class="mt-1 text-sm text-slate-400">Fund a strategy to activate automated rebalancing.</p></div>
            <button @click="showCreateForm=!showCreateForm" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white shadow transition hover:bg-indigo-500" x-text="showCreateForm?'Cancel':'New Strategy'"></button>
          </div>

          <!-- Create form -->
          <div x-show="showCreateForm" x-transition class="mt-6 rounded-xl border border-slate-700/50 bg-surface-800 p-6">
            <h3 class="mb-4 text-sm font-semibold uppercase tracking-wider text-slate-300">Create Strategy</h3>
            <form @submit.prevent="createStrategy()" class="space-y-4">
              <div class="grid grid-cols-2 gap-4">
                <div><label class="mb-1 block text-xs font-medium text-slate-400">Name</label>
                  <input x-model="newStrategy.name" type="text" required placeholder="My Strategy" class="w-full rounded-lg border border-slate-600 bg-surface-900 px-3 py-2 text-sm text-white placeholder-slate-500 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"></div>
                <div><label class="mb-1 block text-xs font-medium text-slate-400">Type</label>
                  <select x-model="newStrategy.strategy_type" class="w-full rounded-lg border border-slate-600 bg-surface-900 px-3 py-2 text-sm text-white outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                    <option value="fixed_weight">Fixed Weight</option><option value="equal_weight">Equal Weight</option><option value="momentum">Momentum</option>
                  </select></div>
              </div>
              <div><label class="mb-1 block text-xs font-medium text-slate-400">Description</label>
                <input x-model="newStrategy.description" type="text" placeholder="Optional" class="w-full rounded-lg border border-slate-600 bg-surface-900 px-3 py-2 text-sm text-white placeholder-slate-500 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"></div>
              <div><label class="mb-1 block text-xs font-medium text-slate-400">Assets</label>
                <template x-for="(a,i) in newStrategy.assets" :key="i">
                  <div class="mb-2 flex items-center gap-2">
                    <input x-model="newStrategy.assets[i]" type="text" placeholder="BTCUSD" required class="w-36 rounded-lg border border-slate-600 bg-surface-900 px-3 py-2 text-sm text-white placeholder-slate-500 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                    <template x-if="newStrategy.strategy_type==='fixed_weight'">
                      <input x-model.number="newStrategy.weights[newStrategy.assets[i]]" type="number" step="0.01" min="0" max="1" placeholder="0.50" class="w-24 rounded-lg border border-slate-600 bg-surface-900 px-3 py-2 text-sm text-white placeholder-slate-500 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                    </template>
                    <button type="button" @click="newStrategy.assets.splice(i,1)" class="text-slate-500 hover:text-red-400" x-show="newStrategy.assets.length>1">
                      <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                  </div>
                </template>
                <button type="button" @click="newStrategy.assets.push('')" class="text-xs font-medium text-indigo-400 hover:text-indigo-300">+ Add asset</button>
              </div>
              <div class="grid grid-cols-3 gap-4">
                <div><label class="mb-1 block text-xs font-medium text-slate-400">Rebalance Interval</label>
                  <select x-model.number="newStrategy.rebalance_interval_seconds" class="w-full rounded-lg border border-slate-600 bg-surface-900 px-3 py-2 text-sm text-white outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                    <option value="30">30 sec</option><option value="60">1 min</option><option value="300">5 min</option><option value="600">10 min</option><option value="3600">1 hr</option><option value="86400">1 day</option>
                  </select></div>
                <div><label class="mb-1 block text-xs font-medium text-slate-400">Drift Threshold</label>
                  <input x-model.number="newStrategy.drift_threshold" type="number" step="0.01" min="0" max="1" class="w-full rounded-lg border border-slate-600 bg-surface-900 px-3 py-2 text-sm text-white outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"></div>
                <div x-show="newStrategy.strategy_type==='momentum'"><label class="mb-1 block text-xs font-medium text-slate-400">Lookback (days)</label>
                  <input x-model.number="newStrategy.lookback_days" type="number" min="1" max="90" class="w-full rounded-lg border border-slate-600 bg-surface-900 px-3 py-2 text-sm text-white outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"></div>
              </div>
              <div class="flex justify-end">
                <button type="submit" :disabled="creating" class="rounded-lg bg-emerald-600 px-5 py-2 text-sm font-medium text-white shadow transition hover:bg-emerald-500 disabled:opacity-50">
                  <span x-show="!creating">Create</span><span x-show="creating">Creating...</span>
                </button>
              </div>
            </form>
          </div>

          <!-- Strategy cards -->
          <div class="mt-6 space-y-4">
            <template x-if="strategies.length===0"><div class="rounded-xl border border-dashed border-slate-700 py-16 text-center text-sm text-slate-500">No strategies yet.</div></template>
            <template x-for="s in strategies" :key="s.id">
              <div class="rounded-xl border border-slate-700/50 bg-surface-800 animate-fade-in overflow-hidden">
                <!-- Header -->
                <div class="flex items-start justify-between p-5">
                  <div class="flex-1">
                    <div class="flex items-center gap-2">
                      <h3 class="text-base font-semibold text-white" x-text="s.name"></h3>
                      <span class="rounded-full px-2 py-0.5 text-[10px] font-bold uppercase"
                            :class="s.is_active?'bg-emerald-500/20 text-emerald-300':'bg-slate-500/20 text-slate-400'"
                            x-text="s.is_active?'Active':'Inactive'"></span>
                      <span class="rounded-full bg-indigo-500/15 px-2 py-0.5 text-[10px] font-medium text-indigo-300" x-text="s.strategy_type.replace('_',' ')"></span>
                    </div>
                    <p class="mt-1 text-sm text-slate-400" x-text="s.description||''"></p>
                  </div>
                  <div class="flex items-center gap-2 ml-4">
                    <template x-if="!s.is_active && !s.funded_amount">
                      <div class="flex items-center gap-1">
                        <input type="number" min="10" step="10" placeholder="$500" x-model.number="fundAmounts[s.id]"
                               class="w-24 rounded-lg border border-slate-600 bg-surface-900 px-2 py-1.5 text-xs text-white placeholder-slate-500 outline-none focus:border-emerald-500">
                        <button @click="fundStrategy(s.id)" class="rounded-lg bg-emerald-600 px-3 py-1.5 text-xs font-medium text-white transition hover:bg-emerald-500">Fund</button>
                      </div>
                    </template>
                    <template x-if="s.is_active">
                      <div class="flex items-center gap-2">
                        <button @click="triggerRebalance(s.id)" class="rounded-lg bg-indigo-600 px-3 py-1.5 text-xs font-medium text-white transition hover:bg-indigo-500">Rebalance</button>
                        <button @click="liquidateStrategy(s.id)" class="rounded-lg border border-red-500/40 px-3 py-1.5 text-xs font-medium text-red-400 transition hover:bg-red-500/10">Liquidate</button>
                      </div>
                    </template>
                  </div>
                </div>

                <!-- Funded amount + holdings -->
                <template x-if="s.funded_amount">
                  <div class="border-t border-slate-700/30 px-5 py-4">
                    <div class="flex items-center gap-6 mb-3">
                      <div><span class="text-xs text-slate-400">Funded</span><span class="ml-2 text-sm font-semibold text-white" x-text="'$'+s.funded_amount.toLocaleString(undefined,{minimumFractionDigits:2})"></span></div>
                      <div><span class="text-xs text-slate-400">Holdings Value</span><span class="ml-2 text-sm font-semibold text-white" x-text="'$'+holdingsValue(s).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})"></span></div>
                    </div>
                    <template x-if="s.holdings && Object.keys(s.holdings).length > 0">
                      <div class="space-y-1.5">
                        <template x-for="(info, sym) in s.holdings" :key="sym">
                          <div class="flex items-center justify-between rounded-lg bg-slate-700/30 px-3 py-2 text-xs">
                            <span class="font-medium text-white" x-text="sym.replace(/\/?USD$/,'')"></span>
                            <div class="flex items-center gap-4 text-slate-300">
                              <span x-text="(info.qty||0).toFixed(6)+' units'"></span>
                              <span class="font-mono" x-text="'$'+(((info.qty||0)*(getPrice(sym)||0))).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})"></span>
                              <span class="text-slate-400" x-text="s.current_allocation&&s.current_allocation[sym]?((s.current_allocation[sym]*100).toFixed(0)+'% target'):''" ></span>
                            </div>
                          </div>
                        </template>
                      </div>
                    </template>
                    <template x-if="!s.holdings || Object.keys(s.holdings).length === 0">
                      <p class="text-xs text-slate-500">No holdings yet — waiting for first rebalance.</p>
                    </template>
                  </div>
                </template>

                <!-- Allocation bar -->
                <template x-if="s.current_allocation && s.holdings && Object.keys(s.holdings).length > 0">
                  <div class="px-5 pb-3">
                    <div class="flex h-2 overflow-hidden rounded-full bg-slate-700/40">
                      <template x-for="(asset,idx) in s.assets" :key="asset">
                        <div class="transition-all duration-500" :style="`width:${(s.current_allocation[asset]||0)*100}%`"
                             :class="['bg-amber-500','bg-indigo-500','bg-emerald-500','bg-rose-500','bg-cyan-500','bg-violet-500'][idx%6]"></div>
                      </template>
                    </div>
                  </div>
                </template>

                <!-- Meta -->
                <div class="flex items-center gap-4 border-t border-slate-700/30 px-5 py-2.5 text-[11px] text-slate-500">
                  <span x-text="'Interval: '+fmtInterval(s.rebalance_interval_seconds)"></span>
                  <span x-text="'Drift: '+(s.drift_threshold*100).toFixed(0)+'%'"></span>
                  <span x-text="s.last_evaluated_at?'Last eval: '+fmtTime(s.last_evaluated_at):'Never evaluated'"></span>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- ==================== ACCOUNT ==================== -->
      <template x-if="page==='account'">
        <div class="animate-fade-in">
          <h2 class="text-2xl font-bold text-white">Account</h2>
          <p class="mt-1 text-sm text-slate-400">Live Alpaca paper trading account.</p>
          <template x-if="acct.error"><div class="mt-6 rounded-xl border border-red-500/20 bg-red-500/10 p-5 text-sm text-red-300" x-text="acct.error"></div></template>
          <template x-if="!acct.error && acct.equity">
            <div>
              <div class="mt-6 grid grid-cols-3 gap-4">
                <template x-for="card in [{label:'Equity',val:acct.equity},{label:'Cash',val:acct.cash},{label:'Buying Power',val:acct.buying_power}]">
                  <div class="rounded-xl border border-slate-700/50 bg-surface-800 p-5">
                    <p class="text-xs font-medium uppercase tracking-wider text-slate-400" x-text="card.label"></p>
                    <p class="mt-1 text-2xl font-bold text-white" x-text="'$'+card.val.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})"></p>
                  </div>
                </template>
              </div>
              <div class="mt-6">
                <h3 class="mb-3 text-sm font-semibold uppercase tracking-wider text-slate-300">Positions</h3>
                <template x-if="acct.positions&&acct.positions.length>0">
                  <div class="overflow-hidden rounded-xl border border-slate-700/50">
                    <table class="w-full text-sm">
                      <thead class="bg-slate-700/30"><tr class="text-left text-xs text-slate-400">
                        <th class="px-5 py-3 font-medium">Symbol</th><th class="px-5 py-3 font-medium text-right">Qty</th><th class="px-5 py-3 font-medium text-right">Price</th>
                        <th class="px-5 py-3 font-medium text-right">Value</th><th class="px-5 py-3 font-medium text-right">P&L</th><th class="px-5 py-3 font-medium text-right">%</th>
                      </tr></thead>
                      <tbody class="divide-y divide-slate-700/30">
                        <template x-for="p in acct.positions" :key="p.symbol">
                          <tr class="text-slate-200">
                            <td class="px-5 py-3 font-semibold text-white" x-text="p.symbol.replace(/\/?USD$/,'')"></td>
                            <td class="px-5 py-3 text-right font-mono" x-text="p.qty.toFixed(6)"></td>
                            <td class="px-5 py-3 text-right font-mono" x-text="'$'+p.current_price.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})"></td>
                            <td class="px-5 py-3 text-right font-mono" x-text="'$'+p.market_value.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})"></td>
                            <td class="px-5 py-3 text-right font-mono" :class="p.unrealized_pl>=0?'text-emerald-400':'text-red-400'" x-text="(p.unrealized_pl>=0?'+':'')+('$'+Math.abs(p.unrealized_pl).toFixed(2))"></td>
                            <td class="px-5 py-3 text-right font-mono" :class="p.unrealized_plpc>=0?'text-emerald-400':'text-red-400'" x-text="(p.unrealized_plpc*100).toFixed(2)+'%'"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </template>
                <template x-if="!acct.positions||acct.positions.length===0"><div class="rounded-xl border border-dashed border-slate-700 py-12 text-center text-sm text-slate-500">No open positions.</div></template>
              </div>
            </div>
          </template>
        </div>
      </template>

      <!-- ==================== JOBS ==================== -->
      <template x-if="page==='jobs'">
        <div class="animate-fade-in">
          <div class="flex items-center justify-between"><div><h2 class="text-2xl font-bold text-white">Rebalance Jobs</h2><p class="mt-1 text-sm text-slate-400">Track runs and trade executions.</p></div>
            <button @click="loadJobs()" class="rounded-lg border border-slate-600 px-3 py-1.5 text-xs font-medium text-slate-300 transition hover:bg-slate-700">Refresh</button></div>
          <div class="mt-6 space-y-3">
            <template x-if="jobs.length===0"><div class="rounded-xl border border-dashed border-slate-700 py-16 text-center text-sm text-slate-500">No jobs yet.</div></template>
            <template x-for="job in jobs" :key="job.id">
              <div class="rounded-xl border border-slate-700/50 bg-surface-800 animate-fade-in">
                <div class="flex items-center justify-between px-5 py-3.5 cursor-pointer" @click="job._open=!job._open">
                  <div class="flex items-center gap-3">
                    <span class="h-2.5 w-2.5 rounded-full" :class="statusColor(job.status)"></span>
                    <span class="text-sm font-semibold text-white" x-text="strategyName(job.strategy_id)"></span>
                    <span class="text-xs text-slate-500" x-text="job.account_id==='liquidation'?'(liquidation)':job.status==='pending'?'queued for worker...':''"></span>
                  </div>
                  <div class="flex items-center gap-3">
                    <span class="rounded-full px-2.5 py-0.5 text-xs font-medium" :class="statusBadge(job.status)" x-text="job.status"></span>
                    <span class="text-xs text-slate-500" x-text="fmtTime(job.created_at)"></span>
                    <svg class="h-4 w-4 text-slate-500 transition-transform" :class="job._open&&'rotate-180'" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                  </div>
                </div>
                <div x-show="job._open" x-transition class="border-t border-slate-700/30 px-5 py-4 space-y-3">
                  <div x-show="job.last_error" class="rounded-lg px-4 py-3 border"
                       :class="['stuck','partially_executed'].includes(job.status)?'bg-red-500/10 border-red-500/20':'bg-slate-700/30 border-slate-700/40'">
                    <p class="text-xs font-medium mb-1" :class="['stuck','partially_executed'].includes(job.status)?'text-red-400':'text-slate-400'"
                       x-text="['stuck','partially_executed'].includes(job.status)?'Error':'Detail'"></p>
                    <p class="text-xs font-mono whitespace-pre-wrap" :class="['stuck','partially_executed'].includes(job.status)?'text-red-300/80':'text-slate-300'" x-text="job.last_error"></p>
                  </div>
                  <div x-show="job.trade_executions&&job.trade_executions.length>0">
                    <div class="overflow-hidden rounded-lg border border-slate-700/40">
                      <table class="w-full text-xs"><thead class="bg-slate-700/30"><tr class="text-left text-slate-400">
                        <th class="px-4 py-2 font-medium">Symbol</th><th class="px-4 py-2 font-medium">Side</th><th class="px-4 py-2 font-medium text-right">Amount</th>
                        <th class="px-4 py-2 font-medium">Status</th><th class="px-4 py-2 font-medium text-right">Filled</th><th class="px-4 py-2 font-medium text-right">Price</th>
                      </tr></thead>
                      <tbody class="divide-y divide-slate-700/30"><template x-for="t in job.trade_executions" :key="t.id">
                        <tr class="text-slate-200">
                          <td class="px-4 py-2 font-medium text-white" x-text="t.symbol.replace(/\/?USD$/,'')"></td>
                          <td class="px-4 py-2"><span class="rounded-full px-2 py-0.5 text-[10px] font-bold uppercase" :class="t.side==='buy'?'bg-emerald-500/20 text-emerald-300':'bg-red-500/20 text-red-300'" x-text="t.side"></span></td>
                          <td class="px-4 py-2 text-right font-mono" x-text="'$'+t.intended_qty.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})"></td>
                          <td class="px-4 py-2"><span class="rounded-full px-2 py-0.5 text-[10px] font-medium" :class="statusBadge(t.status)" x-text="t.status"></span></td>
                          <td class="px-4 py-2 text-right font-mono" x-text="t.filled_qty!=null?t.filled_qty:'—'"></td>
                          <td class="px-4 py-2 text-right font-mono" x-text="t.filled_avg_price!=null?'$'+Number(t.filled_avg_price).toFixed(2):'—'"></td>
                        </tr>
                      </template></tbody></table>
                    </div>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>
  </main>
</div>

<script>
function app() {
  return {
    page:'strategies', health:'loading', toast:{show:false,message:'',type:'success'}, loading:false, creating:false,
    strategies:[], jobs:[], acct:{}, showCreateForm:false, fundAmounts:{},
    newStrategy:{ name:'',description:'',strategy_type:'fixed_weight',assets:['BTCUSD','ETHUSD','SOLUSD'],weights:{'BTCUSD':0.5,'ETHUSD':0.3,'SOLUSD':0.2},rebalance_interval_seconds:86400,drift_threshold:0.05,lookback_days:7 },

    async init() {
      await Promise.all([this.checkHealth(),this.loadStrategies(),this.loadJobs(),this.loadAccount()]);
      setInterval(async()=>{await Promise.all([this.loadStrategies(),this.loadJobs(),this.checkHealth(),this.loadAccount()])},3000);
    },
    showToast(m,type='success'){this.toast={show:true,message:m,type};setTimeout(()=>this.toast.show=false,3500)},
    async api(method,path,body=null){const o={method,headers:{'Content-Type':'application/json'}};if(body)o.body=JSON.stringify(body);const r=await fetch(path,o);if(!r.ok){const e=await r.json().catch(()=>({detail:r.statusText}));throw new Error(e.detail||JSON.stringify(e))}if(r.status===204)return null;return r.json()},
    async checkHealth(){try{const d=await this.api('GET','/health');this.health=d.status==='ok'?'ok':'error'}catch{this.health='error'}},
    async loadStrategies(){try{this.strategies=await this.api('GET','/strategies')}catch(e){console.error(e)}},
    async loadAccount(){try{this.acct=await this.api('GET','/account')}catch(e){this.acct={error:e.message}}},
    async loadJobs(){try{const r=await this.api('GET','/rebalance?limit=30');const o=new Set(this.jobs.filter(j=>j._open).map(j=>j.id));this.jobs=r.map(j=>({...j,_open:o.has(j.id)}))}catch(e){console.error(e)}},

    async createStrategy(){
      this.creating=true;
      try{
        const s=this.newStrategy,config={};
        if(s.strategy_type==='fixed_weight'){const w={};for(const a of s.assets){if(a&&s.weights[a])w[a]=s.weights[a]}config.weights=w}
        if(s.strategy_type==='momentum'){config.lookback_days=s.lookback_days||7;config.top_n=Math.max(1,Math.floor(s.assets.length/2));config.top_weight=0.70}
        await this.api('POST','/strategies',{name:s.name,description:s.description,strategy_type:s.strategy_type,assets:s.assets.filter(Boolean).map(a=>a.toUpperCase()),config,rebalance_interval_seconds:s.rebalance_interval_seconds,drift_threshold:s.drift_threshold});
        this.showToast('Strategy created — fund it to activate');this.showCreateForm=false;this.newStrategy.name='';this.newStrategy.description='';await this.loadStrategies()
      }catch(e){this.showToast(e.message,'error')}finally{this.creating=false}
    },

    async fundStrategy(id){
      const amt=this.fundAmounts[id];
      if(!amt||amt<1){this.showToast('Enter a dollar amount','error');return}
      try{await this.api('POST',`/strategies/${id}/fund`,{amount:amt});this.showToast(`Strategy funded with $${amt}`);await this.loadStrategies()}catch(e){this.showToast(e.message,'error')}
    },

    async liquidateStrategy(id){
      try{await this.api('POST',`/strategies/${id}/liquidate`);this.showToast('Liquidation started');this.page='jobs';await this.loadJobs()}catch(e){this.showToast(e.message,'error')}
    },

    async triggerRebalance(id){
      try{const d=await this.api('POST','/rebalance',{strategy_id:id});this.showToast(`Rebalance started`);this.page='jobs';await this.loadJobs()}catch(e){this.showToast(e.message,'error')}
    },

    getPrice(sym){if(!this.acct.positions)return 0;const p=this.acct.positions.find(p=>p.symbol===sym);return p?p.current_price:0},
    holdingsValue(s){if(!s.holdings)return 0;let t=0;for(const[sym,info]of Object.entries(s.holdings)){const q=info.qty||0;t+=q*this.getPrice(sym)}return t},
    strategyName(id){const s=this.strategies.find(s=>s.id===id);return s?s.name:'Unknown'},
    statusColor(s){const m={pending:'bg-yellow-400',running:'bg-blue-400 pulse-dot',executing_trades:'bg-blue-400 pulse-dot',no_action:'bg-slate-400',completed:'bg-emerald-400',partially_executed:'bg-amber-400 pulse-dot',stuck:'bg-red-400',cancelling:'bg-orange-400',cancelled:'bg-slate-500'};return m[s]||'bg-slate-400'},
    statusBadge(s){const m={pending:'bg-yellow-500/20 text-yellow-300',running:'bg-blue-500/20 text-blue-300',executing_trades:'bg-blue-500/20 text-blue-300',no_action:'bg-slate-500/20 text-slate-300',completed:'bg-emerald-500/20 text-emerald-300',partially_executed:'bg-amber-500/20 text-amber-300',stuck:'bg-red-500/20 text-red-300',cancelling:'bg-orange-500/20 text-orange-300',cancelled:'bg-slate-500/20 text-slate-300',submitted:'bg-blue-500/20 text-blue-300',filled:'bg-emerald-500/20 text-emerald-300',partially_filled:'bg-amber-500/20 text-amber-300',failed:'bg-red-500/20 text-red-300'};return m[s]||'bg-slate-500/20 text-slate-300'},
    fmtTime(iso){if(!iso)return'—';const d=new Date(iso);return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})+' '+d.toLocaleDateString([],{month:'short',day:'numeric'})},
    fmtInterval(sec){if(sec<60)return sec+'s';if(sec<3600)return Math.round(sec/60)+'m';if(sec<86400)return Math.round(sec/3600)+'h';return Math.round(sec/86400)+'d'},
  }
}
</script>
</body>
</html>
