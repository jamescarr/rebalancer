services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rebalancer
      POSTGRES_USER: rebalancer
      POSTGRES_PASSWORD: rebalancer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: celery -A app.celery_app worker --loglevel=info
    volumes:
      - .:/app
      - /app/.venv
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  beat:
    build: .
    command: celery -A app.celery_app beat --loglevel=info
    volumes:
      - .:/app
      - /app/.venv
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
